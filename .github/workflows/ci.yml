name: Portable Multi-Platform Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Linux Portable AppImage & Tarball ──────────────────────────────────────
  build-linux:
    name: Linux Portable AppImage (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev qt6-base-dev

      - name: Build Portable Linux AppImage & Tarball
        run: |
          chmod +x packaging/linux/build_appimage.sh
          ./packaging/linux/build_appimage.sh

      - name: Upload Linux Portable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ulwai-linux-portable
          path: packaging/dist/*
          retention-days: 14

  # ─── Windows Portable MinGW-w64 Setup (MSYS2 UCRT64) ────────────────────────
  build-windows:
    name: Windows Portable MinGW-w64 (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2 & MinGW-w64 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-curl
            zip

      - name: Configure CMake with MinGW Ninja
        shell: msys2 {0}
        run: |
          cmake -B build-mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=ON \
            -DBUILD_TESTS=OFF

      - name: Compile Windows Executables
        shell: msys2 {0}
        run: |
          cmake --build build-mingw --config Release --parallel

      - name: Package Portable Windows Distribution
        shell: msys2 {0}
        run: |
          if [ -f "VERSION" ]; then
            VERSION=$(tr -d '[:space:]' < VERSION)
          else
            VERSION="2.0.0"
          fi

          DIST_NAME="ulwai-v${VERSION}-windows-x64-portable"
          STAGE="build/stage/${DIST_NAME}"
          mkdir -p "${STAGE}"
          mkdir -p "packaging/dist"

          # Copy compiled binaries and essential metadata
          cp build-mingw/ulw-ai-agent.exe "${STAGE}/"
          cp build-mingw/ulwai.exe "${STAGE}/"
          cp build-mingw/ulwai-cli.exe "${STAGE}/"
          cp README.md LICENSE "${STAGE}/"
          if [ -d "resources" ]; then
            cp -r resources "${STAGE}/"
          fi

          # Deploy Qt runtime plugins and libraries
          if command -v windeployqt6 &>/dev/null; then
            windeployqt6 --release --no-translations "${STAGE}/ulw-ai-agent.exe" || true
          elif command -v windeployqt &>/dev/null; then
            windeployqt --release --no-translations "${STAGE}/ulw-ai-agent.exe" || true
          fi

          # Copy essential MinGW runtime and dynamic library dependencies
          for dll in libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll libcurl-4.dll; do
            if [ -f "/ucrt64/bin/${dll}" ] && [ ! -f "${STAGE}/${dll}" ]; then
              cp "/ucrt64/bin/${dll}" "${STAGE}/"
            fi
          done

          # Archive into clean self-contained portable ZIP
          cd "build/stage"
          zip -9 -r "../../packaging/dist/${DIST_NAME}.zip" "${DIST_NAME}"
          cd ../..
          echo "Created portable package: packaging/dist/${DIST_NAME}.zip"

      - name: Upload Windows Portable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ulwai-windows-portable
          path: packaging/dist/*.zip
          retention-days: 14

  # ─── macOS Portable Setup (Apple Silicon .dmg & .app) ───────────────────────
  build-macos:
    name: macOS Portable DMG (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt 6 via Homebrew
        run: |
          brew install qt@6 cmake

      - name: Build Portable macOS App & DMG
        run: |
          chmod +x packaging/macos/build_macos.sh
          ./packaging/macos/build_macos.sh

      - name: Upload macOS Portable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ulwai-macos-portable
          path: |
            packaging/dist/*.dmg
            packaging/dist/*macos*.tar.gz
          retention-days: 14

  # ─── Publish Release Binaries ───────────────────────────────────────────────
  release:
    name: Publish Release Packages
    needs: [build-linux, build-windows, build-macos]
    if: |
      always() &&
      (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success') &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
       startsWith(github.ref, 'refs/tags/v') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Global Checksums
        working-directory: release-assets
        run: |
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Metadata
        id: meta
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=ULWAI AI Agent ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=latest-build" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=ULWAI AI Agent - Portable Continuous Build (v${VERSION})" >> $GITHUB_OUTPUT
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.TAG_NAME }}
          name: ${{ steps.meta.outputs.RELEASE_NAME }}
          draft: false
          prerelease: ${{ steps.meta.outputs.PRERELEASE == 'true' }}
          make_latest: ${{ steps.meta.outputs.PRERELEASE == 'false' }}
          generate_release_notes: true
          files: |
            release-assets/*
