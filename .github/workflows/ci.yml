name: Portable Multi-Platform Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Linux Portable AppImage & Tarball ──────────────────────────────────────
  build-linux:
    name: Linux Portable AppImage (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev qt6-base-dev

      - name: Build Portable Linux AppImage & Tarball
        run: |
          chmod +x packaging/linux/build_appimage.sh
          ./packaging/linux/build_appimage.sh

      - name: Upload Linux Portable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ulwai-linux-portable
          path: packaging/dist/*
          retention-days: 14

  # ─── Windows Portable MinGW-w64 Setup ───────────────────────────────────────
  build-windows:
    name: Windows Portable MinGW-w64 (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MinGW-w64 Toolchain
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Setup Qt 6 (MinGW-w64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtbase'

      - name: Extract Project Version
        id: version
        shell: pwsh
        run: |
          if (Test-Path "VERSION") {
            $ver = (Get-Content "VERSION").Trim()
          } else {
            $ver = "2.0.0"
          }
          echo "ULWAI_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake with MinGW
        shell: pwsh
        run: |
          cmake -B build-mingw `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_GUI=ON `
            -DBUILD_TESTS=OFF

      - name: Compile Windows Executables
        shell: pwsh
        run: |
          cmake --build build-mingw --config Release --parallel

      - name: Package Portable Windows Distribution
        shell: pwsh
        run: |
          $DIST_NAME = "ulwai-v$env:ULWAI_VERSION-windows-x64-portable"
          $STAGE = "build\stage\$DIST_NAME"
          New-Item -ItemType Directory -Force -Path $STAGE
          New-Item -ItemType Directory -Force -Path "packaging\dist"

          # Copy binaries and assets
          Copy-Item "build-mingw\ulw-ai-agent.exe" -Destination $STAGE
          Copy-Item "build-mingw\ulwai.exe" -Destination $STAGE
          Copy-Item "build-mingw\ulwai-cli.exe" -Destination $STAGE
          Copy-Item "README.md" -Destination $STAGE
          Copy-Item "LICENSE" -Destination $STAGE
          if (Test-Path "resources") {
            Copy-Item -Recurse "resources" -Destination $STAGE
          }

          # Deploy runtime dependencies using windeployqt
          windeployqt --release --no-translations --compiler-runtime "$STAGE\ulw-ai-agent.exe"

          # Compress into portable zip
          Compress-Archive -Path "$STAGE\*" -DestinationPath "packaging\dist\$DIST_NAME.zip"

      - name: Upload Windows Portable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ulwai-windows-portable
          path: packaging\dist\*.zip
          retention-days: 14

  # ─── Publish Release Binaries ───────────────────────────────────────────────
  release:
    name: Publish Release Packages
    needs: [build-linux, build-windows]
    if: |
      always() &&
      (needs.build-linux.result == 'success' || needs.build-windows.result == 'success') &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
       startsWith(github.ref, 'refs/tags/v') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Global Checksums
        working-directory: release-assets
        run: |
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Metadata
        id: meta
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=ULWAI AI Agent ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=latest-build" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=ULWAI AI Agent - Portable Continuous Build (v${VERSION})" >> $GITHUB_OUTPUT
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.TAG_NAME }}
          name: ${{ steps.meta.outputs.RELEASE_NAME }}
          draft: false
          prerelease: ${{ steps.meta.outputs.PRERELEASE == 'true' }}
          make_latest: ${{ steps.meta.outputs.PRERELEASE == 'false' }}
          generate_release_notes: true
          files: |
            release-assets/*
